<style>

}
:root[data-theme="light"] {

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

.wrap { max-width: 560px; margin: 0 auto; padding: 0 18px; }

.wrap.enter > *:nth-child(2) { animation-delay: .04s; } .wrap.enter > *:nth-child(3) { animation-delay: .08s; }

.list .item input { flex: none; }

nav.tabs .fab { position: relative; top: -20px; width: 62px; height: 62px; margin: 0 auto; border-radius: 22px; background: var(--ink); color: var(--bg); box-shadow: 0 10px 30px color-mix(in srgb, var(--ink) 22%, transparent); justify-content: center; padding: 0; }
nav.tabs .fab:active { transform: scale(.88) rotate(90deg); }

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 40; opacity: 0; transition: opacity .3s; }
.scrim.show { opacity: 1; }

.sheet:not(.show) { visibility: hidden; transition: transform .35s var(--spring), visibility 0s .35s; }
.sheet.show { transform: none; }
.sheet .inner { max-width: 560px; margin: 0 auto; }
.grab { width: 38px; height: 4px; background: var(--line); border-radius: 9px; margin: 2px auto 12px; }

.cat .e { font-size: 22px; filter: grayscale(1) contrast(1.15); }

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0 14px; }

.field { margin-bottom: 14px; }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.toast.show { opacity: 1; transform: translateX(-50%); }
.seg { display: flex; background: var(--panel-2); border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 12px; }
.seg button { flex: 1; padding: 9px; border-radius: 11px; font-weight: 650; font-size: 13px; color: var(--mute); }
.seg button.on { background: var(--ink); color: var(--bg); }
.goal .ring { width: 60px; height: 60px; flex: none; }
.code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--panel-2); border-radius: 12px; padding: 11px; word-break: break-all; user-select: all; }
ol.steps { padding-left: 20px; margin: 10px 0; } ol.steps li { margin-bottom: 10px; }
code { font-family: ui-monospace, Consolas, monospace; font-size: .92em; background: var(--panel-2); padding: 1px 5px; border-radius: 6px; }
.onb { min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: 28px 0; animation: up .7s var(--spring) both; }

.dots { display: flex; gap: 6px; margin-bottom: 26px; } .dots i { width: 24px; height: 3px; border-radius: 9px; background: var(--line); transition: background .3s; } .dots i.on { background: var(--ink); }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }

@keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: .5; } }
.day { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--mute); font-weight: 600; display: flex; justify-content: space-between; margin: 22px 4px 8px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin: 0 -18px; padding-left: 18px; padding-right: 18px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }

.chart { width: 100%; height: 130px; margin-top: 12px; overflow: visible; }

.chart .ln.dash { stroke: var(--mute); stroke-width: 1.6; stroke-dasharray: 5 5; animation: none; stroke-dashoffset: 0; }

.legend .row { padding: 5px 0; gap: 8px; } .legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }

.lightbox { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 18px; }
.lightbox img { max-width: 100%; max-height: 78vh; border-radius: 14px; }
.lightbox .btn { color: #fff; background: #222; }

.tog:first-child { border-top: 0; }
.cat.new { background: transparent; border: 1.5px dashed var(--mute); color: var(--mute); }
.sheet .actions { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom)); margin: 0 -18px; padding: 12px 18px calc(18px + env(safe-area-inset-bottom)); background: linear-gradient(to bottom, transparent, var(--bg) 14px); z-index: 2; }

.toast.act { pointer-events: auto; }
.list .item .btn.ghost { min-width: 40px; min-height: 40px; }

<script>
'use strict';
/* ---------- storage ---------- */
const KEY = 'kharcha.v1';
const DEFAULT_CATS = [
  { id: 'food', name: 'Food', emoji: '🍔', budget: 0 },
  { id: 'shopping', name: 'Shopping', emoji: '🛍️', budget: 0 },
  { id: 'petrol', name: 'Petrol', emoji: '⛽', budget: 0 },
  { id: 'subscriptions', name: 'Subscriptions', emoji: '🔁', budget: 0 },
  { id: 'groceries', name: 'Groceries', emoji: '🛒', budget: 0 },

const monthKey = d => d.getFullYear() + '-' + (d.getMonth() + 1);
const dueDate = (sub, ref) => new Date(ref.getFullYear(), ref.getMonth(), Math.min(sub.day, new Date(ref.getFullYear(), ref.getMonth() + 1, 0).getDate()), 9, 0);
function runSubs() {
  if (!Array.isArray(S.subs)) S.subs = [];
  let n = 0; const now = new Date();
  S.subs.forEach(sub => {
    const due = dueDate(sub, now), key = monthKey(now);
    if (sub.last === key || +now < +due) return;
    sub.last = key;
    if (!S.tx.some(t => t.id === 'sub-' + sub.id + '-' + key)) { S.tx.push({ id: 'sub-' + sub.id + '-' + key, amt: sub.amt, cat: sub.cat || 'subscriptions', note: sub.name, mode: 'UPI', ts: +due, src: 'recurring' }); n++; }
  });
  if (n) { save(); setTimeout(() => toast(n + ' subscription' + (n > 1 ? 's' : '') + ' logged for this month'), 600); }
}
function upcomingSubs(days = 7) {
  const now = new Date(), out = [];
  (S.subs || []).forEach(sub => {
    let due = dueDate(sub, now);
    if (sub.last === monthKey(now) || +due < +startOfDay(now)) due = dueDate(sub, new Date(now.getFullYear(), now.getMonth() + 1, 1));
    const left = Math.ceil((+due - +startOfDay(now)) / DAY);
    if (left >= 0 && left <= days) out.push({ ...sub, due, left });

  return out.sort((a, b) => a.left - b.left);
}

function calc() {
  const p = period(), now = Date.now(), today = +startOfDay(now);
  const txP = S.tx.filter(t => inRange(t.ts, p.start, p.end));
  const spent = sum(txP.map(t => t.amt));
  const spentToday = sum(txP.filter(t => t.ts >= today).map(t => t.amt));
  const spentBefore = spent - spentToday;
  const income = +S.settings.income || 0, target = +S.settings.saveTarget || 0;
  const spendable = Math.max(0, income - target);
  const daysLeft = Math.max(1, Math.ceil((p.end - today) / DAY));
  const allowToday = income ? (spendable - spentBefore) / daysLeft : 0;
  const leftToday = allowToday - spentToday;
  const savedP = sum(S.saves.filter(s => s.kind !== 'skip' && inRange(s.ts, p.start, p.end)).map(s => s.amt));
  const skippedP = sum(S.saves.filter(s => s.kind === 'skip' && inRange(s.ts, p.start, p.end)).map(s => s.amt));
  const skippedAll = sum(S.saves.filter(s => s.kind === 'skip').map(s => s.amt));
  const skipCount = S.saves.filter(s => s.kind === 'skip').length;
  return { p, txP, spent, spentToday, income, target, spendable, daysLeft, allowToday, leftToday, savedP, skippedP, skippedAll, skipCount };
}
function streak() {
  // Under-budget streak: days in a row where spending stayed under the average daily allowance.
  // Without an income set, it becomes a logging streak (days with at least one entry or skip).
  const income = +S.settings.income || 0, target = +S.settings.saveTarget || 0;
  const byDay = {};
  S.tx.forEach(t => { const k = dayKey(t.ts); byDay[k] = (byDay[k] || 0) + t.amt; });
  const logged = new Set([...S.tx.map(t => dayKey(t.ts)), ...S.saves.map(s => dayKey(s.ts))]);
  const firstDay = +startOfDay(S.created || Date.now());
  let n = 0, d = startOfDay(Date.now());
  const todayOk = () => {
    if (!income) return logged.has(dayKey(d));
    const daily = Math.max(0, income - target) / period(d).days;
    return (byDay[dayKey(d)] || 0) <= daily;
  };
  const okToday = todayOk();
  if (okToday) n++;
  d = new Date(+d - DAY);
  while (+d >= firstDay) {
    if (!todayOk()) break;
    n++; d = new Date(+d - DAY);
    if (n > 3650) break;
  }
  if (n > (S.settings.bestStreak || 0)) { S.settings.bestStreak = n; save(); }
  return { n, mode: income ? 'budget' : 'log' };
}
function goalSaved(g) { return sum(S.saves.filter(s => s.goalId === g.id).map(s => s.amt)); }

function openAdd(pre = {}) {
  const existing = pre.id ? S.tx.find(t => t.id === pre.id) : null;
  const exInc = pre.id && !existing ? (S.inc || []).find(t => t.id === pre.id) : null;
  draft = existing ? { ...existing, amtStr: String(existing.amt), editing: true, dir: 'out' }
    : exInc ? { id: exInc.id, amtStr: String(exInc.amt), cat: exInc.kind, note: exInc.note || '', mode: 'UPI', ts: exInc.ts, src: 'manual', dir: 'in', editing: true }
    : { id: uid(), amtStr: pre.amount ? String(pre.amount) : '', cat: pre.cat || '', note: pre.note || '', mode: pre.mode || 'UPI', ts: pre.ts || Date.now(), src: pre.src || 'manual', kind: pre.kind || '', raw: pre.raw || '', dir: pre.kind === 'credit' ? 'in' : 'out', split: 1 };
  renderAdd();
}
function renderAdd() {
  const d = draft, c = calc(), isIn = d.dir === 'in';

  else if (!d.editing && amt && c.income) {

  } else if (!amt) hint = 'Type the amount';

    if (dup) notice += `<div class="notice">You logged ${money(dup.amt)} ${Math.max(1, Math.round((Date.now() - dup.ts) / 60e3))} min ago. Same payment? Close this to avoid counting it twice.</div>`;

  const dt = new Date(d.ts);
  const local = new Date(dt.getTime() - dt.getTimezoneOffset() * 60e3).toISOString().slice(0, 16);
  const share = d.split > 1 && amt ? Math.round(amt / d.split * 100) / 100 : 0;
  openSheet(`
    ${d.editing ? '' : `<div class="seg dir"><button data-dir="out" class="${isIn ? '' : 'on'}">Spent</button><button data-dir="in" class="${isIn ? 'on' : ''}">Received</button></div>`}
    <div class="amount"><div class="val ${amt ? '' : 'zero'}"><span class="cur">${esc(S.settings.currency)}</span>${d.amtStr ? Number(d.amtStr.replace(/\.$/, '')).toLocaleString('en-IN', { maximumFractionDigits: 2 }) + (d.amtStr.endsWith('.') ? '.' : '') : '0'}</div><div class="hint">${hint}</div></div>
    ${notice}
    <div class="cats">${isIn ? INC_KINDS.map(x => `<button class="cat ${d.cat === x[0] ? 'on' : ''}" data-cat="${x[0]}"><span class="e">${x[2]}</span>${x[1]}</button>`).join('')
      : S.cats.map(x => `<button class="cat ${d.cat === x.id ? 'on' : ''}" data-cat="${x.id}"><span class="e">${x.emoji}</span>${esc(x.name)}</button>`).join('') + `<button class="cat new" data-act="catnew-add"><span class="e">＋</span>New</button>`}</div>
    ${catBudgetHint}
    <input id="note" placeholder="${isIn ? 'Note (e.g. salary, Amazon refund)' : 'Note (what was it?)'}" value="${esc(d.note)}" maxlength="80" autocomplete="off" style="margin:8px 0 10px">
    ${d.more ? `<div class="modes">${['UPI', 'Card', 'Cash'].map(m => `<button data-mode="${m}" class="${d.mode === m ? 'on' : ''}">${m}</button>`).join('')}<input id="when" type="datetime-local" value="${local}" style="flex:1.6;padding:6px 8px;font-size:13px"></div>`
      : `<div class="whenchip" style="gap:8px;flex-wrap:wrap"><button class="chip" data-act="addmore">${relDay(d.ts)} ${timeStr(d.ts)}${isIn ? '' : ' · ' + esc(d.mode)} ▾</button>${isIn ? '' : `<button class="chip" data-act="splitcycle">${d.split > 1 ? `Split ${d.split} ways · yours ${money(share)}` : 'Split bill'}</button>`}${isIn || d.photo ? '' : `<button class="chip" data-act="attach">📎 Receipt</button>`}</div>`}
    ${d.photo ? `<img id="rimg" class="rimg" data-act="viewphoto" alt="Receipt">` : ''}

      <button class="btn primary" data-act="savetx">${d.editing ? 'Update' : 'Save'}</button></div>

  if (d.photo) loadRimg();

function syncDraftInputs() {
  if (!draft) return;
  const n = document.getElementById('note'); if (n) draft.note = n.value;
  const w = document.getElementById('when'); if (w && w.value) draft.ts = new Date(w.value).getTime() || draft.ts;
}
function padKey(k) {
  const d = draft; let s = d.amtStr;
  if (k === '⌫') s = s.slice(0, -1);
  else if (k === '.') { if (!s.includes('.')) s = (s || '0') + '.'; }
  else { if (s.includes('.') && s.split('.')[1].length >= 2) return; if (s === '0') s = ''; if (s.replace('.', '').length >= 9) return; s += k; }
  d.amtStr = s; syncDraftInputs(); renderAdd();
}
function saveTx() {
  syncDraftInputs();
  const full = Math.round((parseFloat(draft.amtStr) || 0) * 100) / 100;
  if (!full) { toast('Type an amount first'); return; }
  if (draft.dir === 'in') {
    const inc = { id: draft.id, amt: full, kind: draft.cat || 'other', note: draft.note.trim(), ts: draft.ts };
    if (!Array.isArray(S.inc)) S.inc = [];
    const k = S.inc.findIndex(x => x.id === inc.id); if (k >= 0) S.inc[k] = inc; else S.inc.push(inc);
    save(); const was = draft.editing; closeSheet(); render(); tick(15);
    if (was) toast('Updated'); else toast(`Logged +${money(full)} received`, 2600, { label: 'Undo', fn: () => { S.inc = S.inc.filter(x => x.id !== inc.id); save(); render(); toast('Removed'); } });
    return;
  }
  const split = !draft.editing && draft.split > 1 ? draft.split : 1;
  const amt = split > 1 ? Math.round(full / split * 100) / 100 : full;
  const tx = { id: draft.id, amt, cat: draft.cat || 'other', note: draft.note.trim(), mode: draft.mode, ts: draft.ts, src: draft.src };
  if (draft.photo) tx.photo = true;
  let iou = null;
  if (split > 1) {
    tx.note = (tx.note || catById(tx.cat).name) + ` (split ${split})`;
    iou = { id: uid(), who: 'Friends', amt: Math.round((full - amt) * 100) / 100, dir: 'owed', note: tx.note, ts: draft.ts, settled: false };
    if (!Array.isArray(S.ious)) S.ious = [];
    S.ious.push(iou);
  }
  const i = S.tx.findIndex(t => t.id === tx.id);
  const before = calc();
  if (i >= 0) S.tx[i] = tx; else S.tx.push(tx);
  save();
  const wasEdit = draft.editing; closeSheet(); render();
  if (navigator.vibrate) navigator.vibrate(15);
  const c = calc();
  const undo = { label: 'Undo', fn: () => { S.tx = S.tx.filter(x => x.id !== tx.id); if (iou) S.ious = S.ious.filter(x => x.id !== iou.id); save(); render(); toast('Removed'); } };
  const cross = budgetCrossing(tx.cat, before, c);
  if (wasEdit) toast('Updated');
  else if (iou) toast(`Logged your ${money(amt)} share · ${money(iou.amt)} owed to you`, 5000, undo);
  else if (cross) toast(cross, 5000, undo);
  else if (c.income) toast(c.leftToday >= 0 ? `Logged ${money(amt)} · ${money(c.leftToday, { dec: false })} left today` : `Logged ${money(amt)} · over today by ${money(-c.leftToday, { dec: false })}`, 2600, undo);
  else toast(`Logged ${money(amt)} under ${catById(tx.cat).name}`, 2600, undo);
  if (fromLink) setTimeout(() => { fromLink = false; }, 0);
}
/** A heads-up when this expense pushes a category past 80% or 100% of its monthly budget. */
function budgetCrossing(catId, before, after) {
  const ct = catById(catId), b = +ct.budget || 0; if (!b) return '';
  const spent = c => sum(c.txP.filter(t => t.cat === catId).map(t => t.amt));
  const s0 = spent(before), s1 = spent(after);
  if (s0 <= b && s1 > b) return `${ct.name} is over budget: ${money(s1)} of ${money(b, { dec: false })}`;
  if (s0 <= b * .8 && s1 > b * .8) return `${ct.name} is at ${Math.round(s1 / b * 100)}% of its budget, ${money(b - s1, { dec: false })} left`;
  return '';
}
function skipTx() {
  syncDraftInputs();
  const amt = Math.round((parseFloat(draft.amtStr) || 0) * 100) / 100;
  if (!amt) { toast('Type what it would have cost'); return; }
  const g = S.goals[0];
  S.saves.push({ id: uid(), amt, kind: 'skip', goalId: g ? g.id : null, note: draft.note.trim() || ('Skipped ' + (draft.cat ? catById(draft.cat).name.toLowerCase() : 'a buy')), ts: Date.now() });
  save(); closeSheet(); render(); confetti();
  toast(g ? `Nice. ${money(amt)} went to ${g.name} instead 💪` : `Nice. ${money(amt)} stayed in your pocket 💪`, 3200);
  checkGoalMilestone(g);
}
function checkGoalMilestone(g) {
  if (!g || !g.target) return;
  const pct = goalSaved(g) / g.target * 100;
  const hit = [100, 75, 50, 25].find(m => pct >= m);
  if (hit && (g.milestone || 0) < hit) { g.milestone = hit; save(); setTimeout(() => { confetti(); toast(hit === 100 ? `🎉 You reached ${g.name}!` : `${hit}% of the way to ${g.name}!`, 3500); }, 900); }
}

    <div class="actions" style="grid-template-columns:1fr"><button class="btn primary" data-act="close">Nice</button></div>`);

function wrapStats() {
  const cur = period(), p = period(new Date(+cur.start - DAY));
  const tx = S.tx.filter(t => inRange(t.ts, p.start, p.end));
  const spent = sum(tx.map(t => t.amt));
  const income = +S.settings.income || 0, target = +S.settings.saveTarget || 0, spendable = Math.max(0, income - target);
  const byCat = {}; tx.forEach(t => byCat[t.cat] = (byCat[t.cat] || 0) + t.amt);
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const byDay = {}; tx.forEach(t => { const k = dayKey(t.ts); byDay[k] = (byDay[k] || 0) + t.amt; });
  const top = Object.entries(byDay).sort((a, b) => b[1] - a[1])[0];
  const busiest = top ? { amt: top[1], ts: tx.find(t => dayKey(t.ts) === top[0]).ts } : null;
  const saved = sum(S.saves.filter(x => x.kind !== 'skip' && inRange(x.ts, p.start, p.end)).map(x => x.amt));
  const skipped = sum(S.saves.filter(x => x.kind === 'skip' && inRange(x.ts, p.start, p.end)).map(x => x.amt));
  const inc = sum((S.inc || []).filter(x => inRange(x.ts, p.start, p.end)).map(x => x.amt));
  return { p, tx, spent, spendable, cats, busiest, saved, skipped, inc, target };
}
function wrapText() {
  const w = wrapStats(), name = w.p.start.toLocaleDateString('en-IN', { month: 'long' });

    (w.skipped ? `. Skipped ${money(w.skipped, { dec: false })} of buys` : '') + (w.saved ? `. Saved first: ${money(w.saved, { dec: false })}` : '') + '.';
}

/* ---------- phone-side extras: widget, reminders, lock, auto-backup ---------- */
let appInfo = '', pushT = null;
function recapPayload() {
  const now = Date.now(), c = calc(), pp = period(new Date(+c.p.start - DAY));
  const wk = S.tx.filter(t => t.ts >= now - 7 * DAY), pw = S.tx.filter(t => t.ts >= now - 14 * DAY && t.ts < now - 7 * DAY);
  const byCat = {}; wk.forEach(t => byCat[t.cat] = (byCat[t.cat] || 0) + t.amt);
  const top = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0];
  return { currency: S.settings.currency, weekSpent: Math.round(sum(wk.map(t => t.amt))), prevWeekSpent: Math.round(sum(pw.map(t => t.amt))),
    topCategory: top ? catById(top[0]).name : '', monthSpent: Math.round(c.spent),
    prevMonthSpent: Math.round(sum(S.tx.filter(t => inRange(t.ts, pp.start, pp.end)).map(t => t.amt))),
    savedThisMonth: Math.round(c.savedP), skippedThisMonth: Math.round(c.skippedP), asOf: now };
}
function pushNative() {
  try { if (!KN) return; } catch (e) { return; }
  clearTimeout(pushT);
  pushT = setTimeout(() => {
    try {
      const c = calc(), neg = c.leftToday < 0;
      const w = c.income ? { amount: money(Math.abs(c.leftToday), { dec: false }), label: neg ? 'Over today by' : 'Safe to spend today', line: c.spentToday ? `Spent ${money(c.spentToday, { dec: false })} today` : 'Nothing spent yet today' }
        : { amount: money(c.spent, { dec: false }), label: 'Spent this month', line: `${c.txP.length} expense${c.txP.length === 1 ? '' : 's'}` };
      if (KN.setWidget) KN.setWidget(w).catch(() => {});
      if (KN.setSchedule) KN.setSchedule({
        bills: (S.subs || []).filter(x => x.remind !== false).map(x => ({ id: x.id, name: x.name, amt: x.amt, day: x.day })),
        recap: recapPayload(),
        enabled: { bills: S.settings.notifBills !== false, weekly: S.settings.notifWeekly !== false, monthly: S.settings.notifMonthly !== false }
      }).catch(() => {});
    } catch (e) {}
  }, 700);
}
function autoBackup() {
  if (!KN || !KN.saveText || S.settings.autoBackup === false || S.tx.length < 5) return;
  if (Date.now() - (S.settings.lastAuto || 0) < 7 * DAY) return;

    .then(() => { S.settings.lastAuto = Date.now(); save(); toast('Weekly backup saved to Downloads/Kharcha', 3500); }).catch(() => {});
}
async function toggleSetting(key) {
  if (key === 'lock') {
    const on = !S.settings.lock;
    if (on) {

      catch (e) { toast('App lock needs the updated Android app'); return; }

const togRow = (key, label, desc, on) => `<div class="tog"><div class="grow"><div class="bold">${label}</div><div class="small muted">${desc}</div></div><button class="chip ${on ? 'sel' : ''}" data-tog="${key}">${on ? 'On' : 'Off'}</button></div>`;

/* ---------- import / export ---------- */
function download(name, text, type) {
  if (typeof KN !== 'undefined' && KN && KN.saveText) {   // the Android app: WebViews cannot download blobs
    KN.saveText({ name, text, mime: type }).then(r => toast('Saved to ' + (r.where || 'Downloads') + ' as ' + name, 4200)).catch(() => toast('Could not save the file'));
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportCsv() {
  const rows = [['Date', 'Time', 'Amount', 'Category', 'Note', 'Mode', 'Type']];
  [...S.tx].sort((a, b) => a.ts - b.ts).forEach(t => { const d = new Date(t.ts); rows.push([d.toLocaleDateString('en-CA'), d.toTimeString().slice(0, 5), t.amt, catById(t.cat).name, t.note, t.mode, 'Expense']); });
  (S.inc || []).forEach(t => { const d = new Date(t.ts); rows.push([d.toLocaleDateString('en-CA'), d.toTimeString().slice(0, 5), t.amt, incKind(t.kind)[1], t.note, '', 'Income']); });
  download('kharcha-' + new Date().toLocaleDateString('en-CA') + '.csv', rows.map(r => r.map(v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v).join(',')).join('\n'), 'text/csv');
}
function importJson() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; f.text().then(t => {
    try { const d = JSON.parse(t); if (d.v !== 1 || !Array.isArray(d.tx)) throw 0; if (!confirm(`Replace this phone's data with the backup (${d.tx.length} expenses)?`)) return; S = Object.assign(freshState(), d); save(); render(); toast('Backup restored'); }
    catch (e) { toast('That file is not a Kharcha backup'); }
  }); };
  inp.click();
}

/* ---------- deep links (#add?...) and share target (?text=...) ---------- */
let fromLink = false;
function handleIncoming() {
  let params = null;
  if (location.hash.startsWith('#add')) {
    const q = location.hash.split('?').slice(1).join('?');
    // MacroDroid pastes the notification text raw after "text=", so it may hold spaces, & or #. Take it whole.
    const ti = q.search(/(^|&)text=/);
    const head = ti >= 0 ? q.slice(0, ti) : q;
    params = new URLSearchParams(head);
    if (ti >= 0) { let raw = q.slice(ti).replace(/^&?text=/, ''); try { raw = decodeURIComponent(raw.replace(/\+/g, ' ')); } catch (e) {} params.set('text', raw); }
  }
  else if (location.search && /[?&](share|text|title|amount)=/.test(location.search)) {
    params = new URLSearchParams(location.search);
    history.replaceState(null, '', location.pathname + '#add');
  }
  if (!params) return false;
  if (!S.settings.onboarded) { S.settings.onboarded = true; save(); render(); }
  const raw = [params.get('title'), params.get('text'), params.get('merchant'), params.get('note')].filter(Boolean).join(' ').trim();
  const P = window.KharchaParse.parse(raw);
  const amount = parseFloat(params.get('amount')) || P.amount || 0;
  const merchant = params.get('merchant') || P.merchant || '';
  const cat = params.get('cat') || window.KharchaParse.guessCategory(merchant + ' ' + raw);
  fromLink = !!raw || !!amount;
  openAdd({ amount, note: params.get('note') || merchant, cat: S.cats.some(c => c.id === cat) ? cat : '', src: (raw || params.get('cat')) ? 'auto' : 'manual', kind: P.kind === 'credit' ? 'credit' : '', raw });
  return true;
}

/* ---------- Android app: payment notifications ---------- */
const KN = IS_APP && window.Capacitor.Plugins ? window.Capacitor.Plugins.KharchaNative : null;
let nat = { listener: false, notifications: false, overlay: false };
function syncCats() { if (KN) KN.setCats({ cats: S.cats.map(c => ({ id: c.id, name: c.name })) }).catch(() => {}); }
async function nativeSync() {
  if (!KN) return;
  try {
    const r = await KN.drain();
    let added = 0;
    (r.items || []).forEach(it => {
      if (S.tx.some(t => t.id === it.id)) return;
      S.tx.push({ id: it.id, amt: it.amt, cat: S.cats.some(c => c.id === it.cat) ? it.cat : 'other', note: it.note || '', mode: 'UPI', ts: it.ts, src: 'notif' });
      added++;
    });
    if (added) { save(); render(); toast(added + ' expense' + (added > 1 ? 's' : '') + ' saved from notifications'); }
    syncCats();
    nat = await KN.status();
    if (nat.notifications) KN.showQuickAdd().catch(() => {});
    if (KN.appInfo) KN.appInfo().then(r => { appInfo = ' · build ' + r.versionName + (r.versionCode ? ' (' + r.versionCode + ')' : ''); }).catch(() => {});
    autoBackup();
    if ((tab === 'settings' || tab === 'home') && !draft) render();
  } catch (e) {}
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-tab]'); if (!t) return;
  if (t.dataset.tab) { go(t.dataset.tab); return; }
  if (t.dataset.key) { tick(); padKey(t.dataset.key); return; }
  if (t.dataset.cat && draft) {
    tick(10); syncDraftInputs();
    // Auto-detected payment with the amount already filled: picking the category is the second tap, so save.
    // (Tapping the category Kharcha already guessed confirms it instead of un-picking it.)
    const auto = !draft.editing && draft.src !== 'manual' && parseFloat(draft.amtStr) && !draft.kind
      && !S.tx.some(x => Math.abs(x.amt - parseFloat(draft.amtStr)) < .01 && Math.abs(x.ts - Date.now()) < 5 * 60e3);
    draft.cat = (draft.cat === t.dataset.cat && !auto) ? '' : t.dataset.cat;
    if (auto) { saveTx(); return; }
    renderAdd();
    if (draft.cat && parseFloat(draft.amtStr)) { const b = $('[data-act="savetx"]'); if (b) b.classList.add('pulse'); }
    return;
  }
  if (t.dataset.dir && draft) { syncDraftInputs(); if (draft.dir !== t.dataset.dir) { draft.dir = t.dataset.dir; draft.cat = ''; draft.split = 1; } renderAdd(); return; }
  if (t.dataset.mode && draft) { syncDraftInputs(); draft.mode = t.dataset.mode; renderAdd(); return; }
  if (t.dataset.hview) { histView = t.dataset.hview; render(true); return; }
  if (t.dataset.hcat !== undefined) { histCat = t.dataset.hcat; render(); return; }
  if (t.dataset.tog) { toggleSetting(t.dataset.tog); return; }
  if (t.dataset.hist) { histFilter = t.dataset.hist; render(); return; }
  if (t.dataset.themeBtn) { S.settings.theme = t.dataset.themeBtn; save(); render(); return; }
  if (t.dataset.pct) { onbRead(); onb.save = String(Math.round((+onb.income || 0) * t.dataset.pct / 100)); renderOnboarding(); return; }
  if (t.dataset.onb) {
    onbRead(); const a = t.dataset.onb;
    if (a === 'next') { onb.step++; renderOnboarding(); }
    if (a === 'skip') { onb.income = ''; onb.save = ''; onb.step++; renderOnboarding(); }
    if (a === 'finish' || a === 'finish-skip') {
      S.settings.name = onb.name; S.settings.income = +onb.income || 0;
      S.settings.saveTarget = onb.income ? (onb.save === '' ? Math.round(S.settings.income * .2) : +onb.save || 0) : 0;
      if (a === 'finish' && onb.goal && +onb.goalTarget) S.goals.push({ id: uid(), name: onb.goal, emoji: '🎯', target: +onb.goalTarget, deadline: '' });
      S.settings.onboarded = true; S.created = Date.now(); save(); go('home');
      if (S.settings.saveTarget) setTimeout(() => toast('First move: save ' + money(S.settings.saveTarget, { dec: false }) + ' before you spend anything'), 400);
    }
    return;
  }
  const act = t.dataset.act, id = t.dataset.id;
  switch (act) {
    case 'add': openAdd(); break;
    case 'edit': openAdd({ id }); break;
    case 'savetx': saveTx(); break;
    case 'skip': skipTx(); break;
    case 'deltx': {
      const inc = (S.inc || []).find(x => x.id === draft.id);
      if (inc) { S.inc = S.inc.filter(x => x.id !== inc.id); save(); closeSheet(); render(); toast('Deleted', 5000, { label: 'Undo', fn: () => { S.inc.push(inc); save(); render(); } }); break; }
      const gone = S.tx.find(x => x.id === draft.id); if (!gone) break;
      S.tx = S.tx.filter(x => x.id !== gone.id); save(); closeSheet(); render(); tick(20);
      toast('Deleted ' + money(gone.amt), 5000, { label: 'Undo', fn: () => { if (!S.tx.some(x => x.id === gone.id)) { S.tx.push(gone); save(); render(); toast('Restored'); } } });
      break;
    }
    case 'addmore': syncDraftInputs(); draft.more = true; renderAdd(); break;
    case 'gotoins': histView = 'insights'; go('history'); break;
    case 'splitcycle': syncDraftInputs(); draft.split = draft.split >= 6 ? 1 : (draft.split || 1) + 1; renderAdd(); break;
    case 'attach': syncDraftInputs(); attachPhoto(); break;
    case 'viewphoto': showPhoto(draft.id, () => { draft.photo = false; renderAdd(); }); break;
    case 'iounew': iouForm(); break;
    case 'iouedit': iouForm(S.ious.find(x => x.id === id)); break;
    case 'iousave': {
      const who = $('#i-who').value.trim(), amt = +$('#i-amt').value; if (!who || !amt) { toast('Who, and how much?'); break; }
      let o = S.ious.find(x => x.id === id); if (!o) { o = { id, ts: Date.now(), settled: false }; S.ious.push(o); }
      Object.assign(o, { who, amt, note: $('#i-note').value.trim(), dir: $('#i-dir').value }); save(); closeSheet(); render(); break;
    }
    case 'ioudel': S.ious = S.ious.filter(x => x.id !== id); save(); closeSheet(); render(); break;
    case 'iousettle': { const o = S.ious.find(x => x.id === id); if (o) { o.settled = true; save(); render(); toast(o.dir === 'owe' ? 'Marked as paid' : 'Marked as received', 4000, { label: 'Undo', fn: () => { o.settled = false; save(); render(); } }); } break; }
    case 'ioucopy': { const o = S.ious.find(x => x.id === id); if (o) { const msg = `Hey ${o.who === 'Friends' ? '' : o.who + ', '}${money(o.amt)} for ${o.note || 'that'}. Send it when you can 🙏`; (navigator.clipboard ? navigator.clipboard.writeText(msg) : Promise.reject()).then(() => toast('Reminder copied. Paste it in a chat'), () => toast(msg, 6000)); } break; }
    case 'cashnew': cashForm(); break;
    case 'cashsave': { const amt = +$('#k-amt').value; if (!amt) { toast('How much did you withdraw?'); break; } S.cash.push({ id: uid(), amt, ts: Date.now(), note: $('#k-note').value.trim() }); save(); closeSheet(); render(); toast('Cash wallet: ' + money(cashBalance(), { dec: false })); break; }
    case 'cashdel': S.cash = S.cash.filter(x => x.id !== id); save(); render(); break;
    case 'wrap': wrapSheet(); break;
    case 'whatsnew': whatsNew(); break;
    case 'wrapshare': { const t = wrapText(); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Copied. Paste it anywhere'), () => toast('Could not copy')); break; }
    case 'toastact': { const f = toast._fn; toast._fn = null; $('#toast').classList.remove('show'); if (f) f(); break; }
    case 'close': if (catForm.back) { const d = catForm.back; catForm.back = null; draft = d; renderAdd(); } else closeSheet(); break;
    case 'newgoal': goalForm(); break;
    case 'goaledit': goalForm(S.goals.find(g => g.id === id)); break;
    case 'goalsave': {
      const name = $('#g-name').value.trim(), target = +$('#g-target').value;
      if (!name || !target) { toast('Give it a name and an amount'); break; }
      const g = S.goals.find(x => x.id === id) || (S.goals.push({ id }), S.goals[S.goals.length - 1]);
      Object.assign(g, { name, target, emoji: $('#g-emoji').value.trim() || '🎯', deadline: $('#g-deadline').value });
      save(); closeSheet(); render(); break;
    }
    case 'goaldel': if (confirm('Delete this goal? Its savings log stays.')) { S.goals = S.goals.filter(g => g.id !== id); save(); closeSheet(); render(); } break;
    case 'deposit': depositForm(S.goals.find(g => g.id === id), false); break;
    case 'savefirst': depositForm(S.goals[0], true); break;
    case 'depositsave': {
      const amt = +$('#d-amt').value; if (!amt) { toast('Type an amount'); break; }
      const gid = $('#d-goal') ? $('#d-goal').value || null : null;
      S.saves.push({ id: uid(), amt, kind: t.dataset.kind, goalId: gid, note: t.dataset.kind === 'first' ? 'Saved first' : '', ts: Date.now() });
      save(); closeSheet(); render(); confetti(); toast(`+${money(amt)} saved. Future you says thanks.`);
      checkGoalMilestone(S.goals.find(g => g.id === gid)); break;
    }
    case 'delsave': if (confirm('Remove this savings entry?')) { S.saves = S.saves.filter(s => s.id !== id); save(); render(); } break;
    case 'catup': { const k = S.cats.findIndex(c => c.id === id); if (k > 0) { [S.cats[k - 1], S.cats[k]] = [S.cats[k], S.cats[k - 1]]; save(); syncCats(); render(); } break; }
    case 'catedit': catForm(S.cats.find(c => c.id === id)); break;
    case 'catnew': catForm(); break;
    case 'catsave': {
      const name = $('#c-name').value.trim(); if (!name) { toast('Name it'); break; }
      const ct = S.cats.find(x => x.id === id) || (S.cats.splice(S.cats.length - 1, 0, { id }), S.cats.find(x => x.id === id));
      Object.assign(ct, { name, emoji: $('#c-emoji').value.trim() || '🏷️', budget: +$('#c-budget').value || 0 });
      save(); syncCats();
      if (catForm.back) { const d = catForm.back; catForm.back = null; d.cat = ct.id; draft = d; renderAdd(); render(); toast('Added ' + ct.name); break; }
      closeSheet(); render(); break;
    }
    case 'catnew-add': { syncDraftInputs(); catForm(null, draft); break; }
    case 'subnew': subForm(); break;
    case 'subedit': subForm(S.subs.find(x => x.id === id)); break;
    case 'subsave': {
      const name = $('#s-name').value.trim(), amt = +$('#s-amt').value;
      if (!name || !amt) { toast('Give it a name and an amount'); break; }
      let sub = S.subs.find(x => x.id === id); const fresh = !sub;
      if (!sub) { sub = { id }; S.subs.push(sub); }
      Object.assign(sub, { name, amt, day: +$('#s-day').value, cat: $('#s-cat').value });
      if (fresh) sub.last = dueDate(sub, new Date()) <= new Date() ? monthKey(new Date()) : '';   // no backfill for a day already gone this month
      save(); closeSheet(); render(); break;
    }
    case 'subdel': S.subs = S.subs.filter(x => x.id !== id); save(); closeSheet(); render(); toast('Removed'); break;
    case 'catdel': if (confirm('Delete this category? Its expenses move to Other.')) { S.tx.forEach(x => { if (x.cat === id) x.cat = 'other'; }); S.cats = S.cats.filter(c => c.id !== id); save(); syncCats(); closeSheet(); render(); } break;
    case 'natlisten': KN && KN.openAccessSettings(); break;
    case 'natoverlay': KN && KN.openOverlaySettings(); break;
    case 'natnotif': KN && KN.requestNotifications().then(() => setTimeout(nativeSync, 1500)); break;
    case 'natbattery': KN && KN.openBatterySettings(); break;
    case 'natquick': KN && KN.requestNotifications().then(() => setTimeout(() => KN.showQuickAdd().then(() => toast('Pull down the notification shade')), 800)); break;
    case 'nattest': KN && (nat.notifications ? KN.test().then(() => toast('Check your notifications')) : toast('Allow popups first')); break;
    case 'copyurl': { const u = appUrl(); (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('Copied. Paste it in MacroDroid.'), () => prompt('Copy this URL', u)); break; }
    case 'smstest': { const v = $('#smstest').value.trim(); if (!v) { toast('Paste an SMS first'); break; } location.hash = '#add?text=' + encodeURIComponent(v); break; }
    case 'export': S.settings.lastBackup = Date.now(); save(); download('kharcha-backup-' + new Date().toLocaleDateString('en-CA') + '.json', JSON.stringify(S), 'application/json'); break;
    case 'import': importJson(); break;
    case 'csv': exportCsv(); break;
    case 'reset': if (confirm('Erase all expenses, goals and settings on this phone?') && confirm('Really? This cannot be undone.')) { localStorage.removeItem(KEY); S = freshState(); onb = { step: 0, name: '', income: '', save: '', goal: '', goalTarget: '' }; render(); } break;
  }
});
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'histq') { histQuery = t.value; const pos = t.selectionStart; render(); const n = $('#histq'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.dataset.catbudget) { const c = S.cats.find(x => x.id === t.dataset.catbudget); c.budget = +t.value || 0; save(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.set) { const k = t.dataset.set; S.settings[k] = ['income', 'saveTarget', 'startDay'].includes(k) ? +t.value || 0 : t.value; save(); render(); }
});
document.addEventListener('keydown', e => {
  if (!draft || ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) { if (e.key === 'Escape' && draft) closeSheet(); return; }
  if (/^[0-9.]$/.test(e.key)) padKey(e.key);
  else if (e.key === 'Backspace') padKey('⌫');
  else if (e.key === 'Enter') saveTx();
  else if (e.key === 'Escape') closeSheet();
});
// swipe down to close the sheet
(() => { let y0 = null; const sh = $('#sheet');
  sh.addEventListener('touchstart', e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
  sh.addEventListener('touchend', e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 90) closeSheet(); y0 = null; }, { passive: true });
})();
window.addEventListener('hashchange', () => { if (location.hash.startsWith('#add')) handleIncoming(); });
// refresh numbers when the app comes back to the front (day may have changed)
document.addEventListener('visibilitychange', () => { if (!document.hidden && !draft) { S = load(); runSubs(); render(); nativeSync(); } });

runSubs();
render();
handleIncoming();
startupSheets();
// Android app: kharcha://add?text=... from MacroDroid
if (IS_APP && Capacitor.Plugins && Capacitor.Plugins.App) {
  let lastUrl = '';
  const openUrl = u => {
    if (!u || u === lastUrl || !u.startsWith('kharcha://')) return; lastUrl = u;
    history.replaceState(null, '', '#add?' + u.split('?').slice(1).join('?')); handleIncoming();
  };
  Capacitor.Plugins.App.addListener('appUrlOpen', e => openUrl(e.url));
  Capacitor.Plugins.App.addListener('backButton', () => {
    if ($('#sheet').classList.contains('show')) closeSheet();
    else if (tab !== 'home') go('home');
    else if (Capacitor.Plugins.App.exitApp) Capacitor.Plugins.App.exitApp();
  });
  nativeSync();
  Capacitor.Plugins.App.getLaunchUrl().then(r => r && openUrl(r.url)).catch(() => {});
}
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
