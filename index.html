<html lang="en">

<style>
@font-face { font-family: "Inter"; font-weight: 100 900; font-style: normal; font-display: swap; src: url(fonts/inter.woff2) format("woff2"); }
:root {
  --bg: #000; --panel: #0b0b0b; --panel-2: #161616; --line: #232323;

}
:root[data-theme="light"] {
  --bg: #fff; --panel: #f6f6f6; --panel-2: #ececec; --line: #e2e2e2;
  --ink: #000; --mute: #666; --accent: #000; --accent-ink: #fff; --warn: #4a4a4a; --bad: #000; --blue: #000; color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); font-feature-settings: "tnum" 1, "cv11" 1; letter-spacing: -.011em; -webkit-font-smoothing: antialiased; }
body { min-height: 100dvh; padding-bottom: calc(96px + env(safe-area-inset-bottom)); overscroll-behavior-y: contain; }

button:active { transform: scale(.95); }
input, select, textarea { font: inherit; letter-spacing: inherit; color: var(--ink); background: var(--panel-2); border: 1px solid transparent; border-radius: 14px; padding: 13px 15px; width: 100%; outline: none; transition: border-color .2s, background .2s; }
input:focus, select:focus, textarea:focus { border-color: var(--ink); background: var(--panel); }
::placeholder { color: var(--mute); opacity: .8; }
h1, h2, h3 { margin: 0; line-height: 1.15; }
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .16em; color: var(--mute); font-weight: 600; margin: 30px 4px 12px; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 18px; }
.wrap.enter > * { animation: up .6s var(--spring) both; }
.wrap.enter > *:nth-child(2) { animation-delay: .04s; } .wrap.enter > *:nth-child(3) { animation-delay: .08s; }
.wrap.enter > *:nth-child(4) { animation-delay: .12s; } .wrap.enter > *:nth-child(5) { animation-delay: .16s; }

.top { display: flex; align-items: center; justify-content: space-between; padding: calc(22px + env(safe-area-inset-top)) 0 10px; }

.chip.fire { background: var(--ink); color: var(--bg); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 12px; }

.hero .label { font-size: 11px; text-transform: uppercase; letter-spacing: .16em; font-weight: 600; }
.hero.over { background: var(--bg); color: var(--ink); border: 2px solid var(--ink); }

.hero .line { font-size: 13px; }
.hero .bar { background: color-mix(in srgb, var(--bg) 18%, var(--ink)); }

.bar.warn > i { opacity: .55; }
.bar.bad > i { background: repeating-linear-gradient(135deg, var(--ink) 0 5px, transparent 5px 9px); outline: 1px solid var(--ink); outline-offset: -1px; }
.hero .bar.bad > i { background: repeating-linear-gradient(135deg, var(--bg) 0 5px, transparent 5px 9px); outline-color: var(--bg); }
.bar.thin { height: 4px; margin: 10px 0 0; }
.row { display: flex; align-items: center; gap: 12px; }
.row .grow, .grow { flex: 1; min-width: 0; }
.muted { color: var(--mute); } .small { font-size: 13px; } .bold { font-weight: 650; }
.ok { color: var(--ink); } .bad { color: var(--ink); text-decoration: underline; text-decoration-style: wavy; text-underline-offset: 3px; } .warn { color: var(--warn); }
.num { font-variant-numeric: tabular-nums; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 16px; padding: 15px 20px; font-weight: 650; background: var(--panel-2); }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--mute); text-decoration: underline; text-underline-offset: 3px; }
.btn.block { width: 100%; }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 12px; }
.list .item input { flex: none; }

.savefirst.done { border-style: solid; border-color: var(--line); }
.gs { filter: grayscale(1) contrast(1.2); }
.emoji { width: 42px; height: 42px; border-radius: 14px; background: var(--panel-2); display: grid; place-items: center; font-size: 20px; flex: none; filter: grayscale(1) contrast(1.15); }
.list .item { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.list .item:first-child { border-top: 0; }
.list button.item:active { opacity: .55; transform: none; }
.tip { font-size: 14px; color: var(--mute); padding: 4px 4px 4px 16px; border-left: 2px solid var(--ink); margin: 22px 0 8px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat .v { font-size: 26px; font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.stat .k { color: var(--mute); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; }
.empty { text-align: center; color: var(--mute); padding: 30px 10px; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); z-index: 30; }

nav.tabs .ind::before { content: ""; width: 26px; background: var(--ink); border-radius: 2px; }

nav.tabs button svg { width: 22px; height: 22px; transition: transform .5s var(--spring); }
nav.tabs button.on { color: var(--ink); }
nav.tabs button.on svg { transform: translateY(-2px) scale(1.12); }
nav.tabs .fab { position: relative; top: -20px; width: 62px; height: 62px; margin: 0 auto; border-radius: 22px; background: var(--ink); color: var(--bg); box-shadow: 0 10px 30px color-mix(in srgb, var(--ink) 22%, transparent); justify-content: center; padding: 0; }

.scrim.show { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--bg); border-radius: 30px 30px 0 0; border-top: 1px solid var(--line); max-height: 96dvh; overflow-y: auto; transform: translateY(105%); transition: transform .5s var(--spring); padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); }
.sheet:not(.show) { visibility: hidden; transition: transform .35s var(--spring), visibility 0s .35s; }
.sheet.show { transform: none; }
.sheet .inner { max-width: 560px; margin: 0 auto; }
.grab { width: 38px; height: 4px; background: var(--line); border-radius: 9px; margin: 2px auto 12px; }

.amount .val.zero { color: var(--mute); }
.amount .hint { font-size: 13px; color: var(--mute); min-height: 20px; margin-top: 2px; }
.cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
.cat { background: var(--panel-2); border-radius: 16px; padding: 10px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; }
.cat .e { font-size: 22px; filter: grayscale(1) contrast(1.15); }
.cat.on { background: var(--ink); color: var(--bg); transform: scale(1.04); }
.cat.on .e { filter: grayscale(1) invert(1) contrast(1.15); }
.modes { display: flex; gap: 8px; margin-bottom: 10px; }
.modes input { min-width: 0; }
.modes button { flex: 1; padding: 9px; border-radius: 14px; background: var(--panel-2); font-size: 13px; font-weight: 650; color: var(--mute); }
.modes button.on { background: var(--ink); color: var(--bg); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0 14px; }
.pad button { padding: 14px 0; font-size: 24px; font-weight: 600; letter-spacing: -.02em; border-radius: 18px; background: var(--panel); font-variant-numeric: tabular-nums; }
.pad button:active { background: var(--ink); color: var(--bg); transform: scale(.92); }
.actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
.notice { background: var(--panel); border: 1px dashed var(--mute); border-radius: 14px; padding: 11px 13px; font-size: 13px; margin: 6px 0; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--mute); font-weight: 600; margin: 0 2px 7px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(112px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(24px) scale(.96); background: var(--ink); color: var(--bg); padding: 13px 20px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 60; opacity: 0; transition: transform .5s var(--spring), opacity .25s; max-width: calc(100% - 32px); text-align: center; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%); }
.seg { display: flex; background: var(--panel-2); border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 12px; }
.seg button { flex: 1; padding: 9px; border-radius: 11px; font-weight: 650; font-size: 13px; color: var(--mute); }
.seg button.on { background: var(--ink); color: var(--bg); }
.goal .ring { width: 60px; height: 60px; flex: none; }
.code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--panel-2); border-radius: 12px; padding: 11px; word-break: break-all; user-select: all; }
ol.steps { padding-left: 20px; margin: 10px 0; } ol.steps li { margin-bottom: 10px; }
code { font-family: ui-monospace, Consolas, monospace; font-size: .92em; background: var(--panel-2); padding: 1px 5px; border-radius: 6px; }
.onb { min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: 28px 0; animation: up .7s var(--spring) both; }
.onb .logo { font-size: 44px; filter: grayscale(1); }
.onb h1 { font-size: 34px; font-weight: 700; letter-spacing: -.045em; margin: 14px 0 8px; }
.onb p { color: var(--mute); margin: 0 0 24px; font-size: 16px; }
.dots { display: flex; gap: 6px; margin-bottom: 26px; } .dots i { width: 24px; height: 3px; border-radius: 9px; background: var(--line); transition: background .3s; } .dots i.on { background: var(--ink); }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; animation: fall 1.6s ease-in forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: .5; } }
.day { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--mute); font-weight: 600; display: flex; justify-content: space-between; margin: 22px 4px 8px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin: 0 -18px; padding-left: 18px; padding-right: 18px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip.sel { background: var(--ink); color: var(--bg); }
.dbars { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 110px; margin-top: 16px; }
.dbars .db { flex: 1; background: color-mix(in srgb, var(--ink) 30%, var(--panel-2)); border-radius: 3px 3px 0 0; transform-origin: bottom; animation: rise .8s var(--spring) both; }
.dbars .db.today { background: var(--ink); } .dbars .db.future { opacity: .35; }
.dbars .bline { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--ink); z-index: 1; pointer-events: none; }
.chart { width: 100%; height: 130px; margin-top: 12px; overflow: visible; }
.chart .ln { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s var(--spring) forwards; }
.chart .ln.dash { stroke: var(--mute); stroke-width: 1.6; stroke-dasharray: 5 5; animation: none; stroke-dashoffset: 0; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.donut { width: 128px; height: 128px; flex: none; }
.legend .row { padding: 5px 0; gap: 8px; } .legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.actions .btn { white-space: nowrap; padding-left: 12px; padding-right: 12px; }
.cat.new { background: transparent; border: 1.5px dashed var(--mute); color: var(--mute); }
.sheet .actions { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom)); margin: 0 -18px; padding: 12px 18px calc(18px + env(safe-area-inset-bottom)); background: linear-gradient(to bottom, transparent, var(--bg) 14px); z-index: 2; }
html.sheet-open .toast { bottom: auto; top: calc(16px + env(safe-area-inset-top)); transform: translateX(-50%) translateY(-24px) scale(.96); }
html.sheet-open .toast.show { transform: translateX(-50%); }
@media (max-height: 760px) { .pad button { padding: 10px 0; font-size: 21px; } .amount .val { font-size: 52px; } .cat { padding: 7px 2px; } .cats { margin: 8px 0; } }
.week { display: flex; gap: 8px; height: 96px; margin-top: 16px; }
.week .d { flex: 1; display: grid; grid-template-rows: 1fr auto; gap: 6px; min-width: 0; }
.week .track { display: flex; align-items: flex-end; }
.week .b { width: 100%; border-radius: 8px; min-height: 4px; background: color-mix(in srgb, var(--ink) 26%, var(--panel-2)); transform-origin: bottom; animation: rise .8s var(--spring) both; }
.week .d.today .b { background: var(--ink); }
.week .l { font-size: 10.5px; color: var(--mute); font-weight: 600; text-align: center; }
.week .d.today .l { color: var(--ink); }
@keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.toast button { margin-left: 14px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; color: inherit; padding: 4px 2px; }
.toast.act { pointer-events: auto; }
.list .item .btn.ghost { min-width: 40px; min-height: 40px; }
@media (min-width: 700px) { body { font-size: 16px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div id="app"></div>
<nav class="tabs" id="tabs" hidden>

  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>

  <button data-tab="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Goals</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Setup</button>
</nav>

<script src="parse.js"></script>
<script>
'use strict';
/* ---------- storage ---------- */
const KEY = 'kharcha.v1';
const DEFAULT_CATS = [
  { id: 'food', name: 'Food', emoji: '🍔', budget: 0 },
  { id: 'shopping', name: 'Shopping', emoji: '🛍️', budget: 0 },
  { id: 'petrol', name: 'Petrol', emoji: '⛽', budget: 0 },
  { id: 'subscriptions', name: 'Subscriptions', emoji: '🔁', budget: 0 },
  { id: 'groceries', name: 'Groceries', emoji: '🛒', budget: 0 },
  { id: 'travel', name: 'Travel', emoji: '🚕', budget: 0 },
  { id: 'bills', name: 'Bills', emoji: '🧾', budget: 0 },
  { id: 'other', name: 'Other', emoji: '✨', budget: 0 },
];
function freshState() {
  return { v: 1, created: Date.now(), settings: { name: '', income: 0, saveTarget: 0, startDay: 1, currency: '₹', theme: 'dark', onboarded: false, bestStreak: 0 },
    cats: DEFAULT_CATS.map(c => ({ ...c })), tx: [], goals: [], saves: [], subs: [] };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.v === 1) {
      const st = Object.assign(freshState(), s);
      if (!st.settings.catsV2) {   // one-time: add Petrol + Subscriptions and put your four main ones first
        DEFAULT_CATS.forEach(d => { if (!st.cats.some(c => c.id === d.id)) st.cats.splice(st.cats.length - 1, 0, { ...d }); });
        const first = ['food', 'shopping', 'petrol', 'subscriptions'];
        const head = first.map(id => st.cats.find(c => c.id === id)).filter(Boolean);
        st.cats = head.concat(st.cats.filter(c => !first.includes(c.id)));
        st.settings.catsV2 = true;
      }
      return st;
    }
  } catch (e) {}
  return freshState();
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save: storage is full or blocked'); } }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n, opts = {}) => {
  const neg = n < 0; n = Math.abs(n);
  const s = n.toLocaleString('en-IN', { maximumFractionDigits: opts.dec === false ? 0 : (n % 1 ? 2 : 0) });
  return (neg ? '−' : '') + S.settings.currency + s;
};
const DAY = 864e5;
const startOfDay = d => { d = new Date(d); d.setHours(0, 0, 0, 0); return d; };
const dayKey = d => { d = new Date(d); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function period(ref = new Date()) {
  const sd = Math.min(28, Math.max(1, S.settings.startDay | 0 || 1));
  let y = ref.getFullYear(), m = ref.getMonth();
  if (ref.getDate() < sd) m -= 1;

/* ---------- recurring subscriptions ---------- */
const monthKey = d => d.getFullYear() + '-' + (d.getMonth() + 1);
const dueDate = (sub, ref) => new Date(ref.getFullYear(), ref.getMonth(), Math.min(sub.day, new Date(ref.getFullYear(), ref.getMonth() + 1, 0).getDate()), 9, 0);
function runSubs() {
  if (!Array.isArray(S.subs)) S.subs = [];
  let n = 0; const now = new Date();
  S.subs.forEach(sub => {
    const due = dueDate(sub, now), key = monthKey(now);
    if (sub.last === key || +now < +due) return;
    sub.last = key;
    if (!S.tx.some(t => t.id === 'sub-' + sub.id + '-' + key)) { S.tx.push({ id: 'sub-' + sub.id + '-' + key, amt: sub.amt, cat: sub.cat || 'subscriptions', note: sub.name, mode: 'UPI', ts: +due, src: 'recurring' }); n++; }
  });
  if (n) { save(); setTimeout(() => toast(n + ' subscription' + (n > 1 ? 's' : '') + ' logged for this month'), 600); }
}
function upcomingSubs(days = 7) {
  const now = new Date(), out = [];
  (S.subs || []).forEach(sub => {
    let due = dueDate(sub, now);
    if (sub.last === monthKey(now) || +due < +startOfDay(now)) due = dueDate(sub, new Date(now.getFullYear(), now.getMonth() + 1, 1));
    const left = Math.ceil((+due - +startOfDay(now)) / DAY);
    if (left >= 0 && left <= days) out.push({ ...sub, due, left });
  });
  return out.sort((a, b) => a.left - b.left);
}

function calc() {
  const p = period(), now = Date.now(), today = +startOfDay(now);
  const txP = S.tx.filter(t => inRange(t.ts, p.start, p.end));
  const spent = sum(txP.map(t => t.amt));
  const spentToday = sum(txP.filter(t => t.ts >= today).map(t => t.amt));
  const spentBefore = spent - spentToday;
  const income = +S.settings.income || 0, target = +S.settings.saveTarget || 0;
  const spendable = Math.max(0, income - target);
  const daysLeft = Math.max(1, Math.ceil((p.end - today) / DAY));
  const allowToday = income ? (spendable - spentBefore) / daysLeft : 0;
  const leftToday = allowToday - spentToday;
  const savedP = sum(S.saves.filter(s => s.kind !== 'skip' && inRange(s.ts, p.start, p.end)).map(s => s.amt));
  const skippedP = sum(S.saves.filter(s => s.kind === 'skip' && inRange(s.ts, p.start, p.end)).map(s => s.amt));
  const skippedAll = sum(S.saves.filter(s => s.kind === 'skip').map(s => s.amt));
  const skipCount = S.saves.filter(s => s.kind === 'skip').length;
  return { p, txP, spent, spentToday, income, target, spendable, daysLeft, allowToday, leftToday, savedP, skippedP, skippedAll, skipCount };
}
function streak() {
  // Under-budget streak: days in a row where spending stayed under the average daily allowance.
  // Without an income set, it becomes a logging streak (days with at least one entry or skip).
  const income = +S.settings.income || 0, target = +S.settings.saveTarget || 0;
  const byDay = {};
  S.tx.forEach(t => { const k = dayKey(t.ts); byDay[k] = (byDay[k] || 0) + t.amt; });
  const logged = new Set([...S.tx.map(t => dayKey(t.ts)), ...S.saves.map(s => dayKey(s.ts))]);
  const firstDay = +startOfDay(S.created || Date.now());
  let n = 0, d = startOfDay(Date.now());
  const todayOk = () => {
    if (!income) return logged.has(dayKey(d));
    const daily = Math.max(0, income - target) / period(d).days;
    return (byDay[dayKey(d)] || 0) <= daily;
  };
  const okToday = todayOk();
  if (okToday) n++;
  d = new Date(+d - DAY);
  while (+d >= firstDay) {
    if (!todayOk()) break;
    n++; d = new Date(+d - DAY);
    if (n > 3650) break;
  }
  if (n > (S.settings.bestStreak || 0)) { S.settings.bestStreak = n; save(); }
  return { n, mode: income ? 'budget' : 'log' };
}
function goalSaved(g) { return sum(S.saves.filter(s => s.goalId === g.id).map(s => s.amt)); }

const TIPS = [
  'Wait 24 hours before any non-essential buy over {x}. Most urges fade.',

  'Unsubscribe from one shop\'s emails today. Less temptation, less spending.',

  'Before you pay, ask: would I buy this at full price if it were not on sale?',

];
function tipOfDay() {
  const i = Math.floor(Date.now() / DAY) % TIPS.length;
  return TIPS[i].replace('{x}', money(500)).replace('{y}', money(500 * 365));
}

    const R = 42, C = 2 * Math.PI * R; let off = 0;
    const segs = rows.map(([id, v], i) => { const len = v / total * C, el = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${shade(i)}" stroke-width="16" stroke-dasharray="${Math.max(0, len - 1.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`; off += len; return el; }).join('');
    h += `<h2>Where it goes</h2><div class="card"><div class="row" style="gap:18px;align-items:center"><svg viewBox="0 0 120 120" class="donut" role="img" aria-label="Share of spending by category">${segs}<text x="60" y="58" text-anchor="middle" font-size="9" fill="var(--mute)">spent</text><text x="60" y="73" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${money(total, { dec: false })}</text></svg>
      <div class="grow legend">${rows.slice(0, 6).map(([id, v], i) => `<div class="row small"><i class="sw" style="background:${shade(i)}"></i><span class="grow ellipsis">${catById(id).emoji} ${esc(catById(id).name)}</span><span class="bold num">${Math.round(v / total * 100)}%</span></div>`).join('')}</div></div></div>`;
  }

  // 4. weekday pattern, last 8 weeks
  const wd = Array.from({ length: 7 }, () => 0), since = Date.now() - 56 * DAY;
  S.tx.filter(t => t.ts >= since).forEach(t => { wd[(new Date(t.ts).getDay() + 6) % 7] += t.amt; });
  const wavg = wd.map(v => v / 8), wm = Math.max(...wavg, 1), busy = wavg.indexOf(Math.max(...wavg));
  if (sum(wd)) h += `<h2>Your week</h2><div class="card"><div class="bold">${['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'][busy]}s cost you the most</div><div class="small muted">Average spend per weekday, last 8 weeks</div>
    <div class="week" style="height:90px">${wavg.map((v, i) => `<div class="d ${i === busy ? 'today' : ''}"><div class="track"><div class="b" style="height:${Math.max(4, v / wm * 100)}%;animation-delay:${i * 50}ms"></div></div><div class="l">${'MTWTFSS'[i]}</div></div>`).join('')}</div></div>`;

  // 5. last 6 months
  const months = []; let ref = new Date();
  for (let i = 0; i < 6; i++) { const q = period(ref); months.unshift({ q, v: sum(S.tx.filter(t => inRange(t.ts, q.start, q.end)).map(t => t.amt)) }); ref = new Date(+q.start - DAY); }
  const mm = Math.max(...months.map(m => m.v), 1);
  if (months.filter(m => m.v).length > 1) h += `<h2>Month by month</h2><div class="card"><div class="week" style="height:110px">${months.map((m, i) => `<div class="d ${i === 5 ? 'today' : ''}"><div class="track"><div class="b" style="height:${Math.max(4, m.v / mm * 100)}%;animation-delay:${i * 60}ms"></div></div><div class="l">${m.q.start.toLocaleDateString('en-IN', { month: 'short' })}</div></div>`).join('')}</div>
    <div class="small muted" style="margin-top:10px">This month so far: ${money(months[5].v, { dec: false })} · last month: ${money(months[4].v, { dec: false })}</div></div>`;

  // 6. top spends
  const by = {}; c.txP.forEach(t => { const k = (t.note || '').trim().toLowerCase(); if (!k) return; const e = by[k] || (by[k] = { name: t.note.trim(), v: 0, n: 0 }); e.v += t.amt; e.n++; });
  const topS = Object.values(by).sort((a, b) => b.v - a.v).slice(0, 5);
  if (topS.length) h += `<h2>Biggest this month</h2><div class="card list">${topS.map((e, i) => `<div class="item"><div class="emoji">${i + 1}</div><div class="grow"><div class="bold ellipsis">${esc(e.name)}</div><div class="small muted">${e.n} time${e.n > 1 ? 's' : ''}</div></div><div class="bold num">${money(e.v, { dec: false })}</div></div>`).join('')}</div>`;
  return h;
}
function viewHistory() {
  if (histView === 'insights') return `<div class="top"><div class="hi">History</div></div>${histToggle()}${viewInsights()}`;
  const p = period();
  let list = [...S.tx];
  if (histFilter === 'month') list = list.filter(t => inRange(t.ts, p.start, p.end));
  if (histFilter === 'week') list = list.filter(t => t.ts >= Date.now() - 7 * DAY);
  if (histQuery) { const q = histQuery.toLowerCase(); list = list.filter(t => (t.note || '').toLowerCase().includes(q) || catById(t.cat).name.toLowerCase().includes(q) || String(t.amt).includes(q)); }
  const catIds = [...new Set(list.map(t => t.cat))];
  if (histCat && !catIds.includes(histCat)) histCat = '';
  const chips = catIds.length > 1 ? `<div class="chips">${[['', 'All']].concat(catIds.map(id => [id, catById(id).emoji + ' ' + catById(id).name])).map(([k, l]) => `<button class="chip ${histCat === k ? 'sel' : ''}" data-hcat="${esc(k)}">${esc(l)}</button>`).join('')}</div>` : '';
  if (histCat) list = list.filter(t => t.cat === histCat);
  list.sort((a, b) => b.ts - a.ts);
  let h = `<div class="top"><div class="hi">History</div><span class="chip">${money(sum(list.map(t => t.amt)))}</span></div>
    ${histToggle()}<div class="seg">${[['all', 'All'], ['month', 'This month'], ['week', '7 days']].map(([k, l]) => `<button data-hist="${k}" class="${histFilter === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <input type="search" id="histq" placeholder="Search notes, categories, amounts" value="${esc(histQuery)}" style="margin-bottom:10px">${chips}`;
  if (!list.length) return h + `<div class="empty">Nothing here yet.</div>`;
  let cur = '', group = [];
  const flush = () => { if (group.length) h += `<div class="day"><span>${relDay(group[0].ts)}</span><span>${money(sum(group.map(t => t.amt)))}</span></div><div class="card list">${group.map(txRow).join('')}</div>`; group = []; };
  list.forEach(t => { const k = dayKey(t.ts); if (k !== cur) { flush(); cur = k; } group.push(t); });
  flush();
  return h;
}

function ring(pct) {

}

  draft = existing ? { ...existing, amtStr: String(existing.amt), editing: true } : {
    id: uid(), amtStr: pre.amount ? String(pre.amount) : '', cat: pre.cat || '', note: pre.note || '', mode: pre.mode || 'UPI', ts: pre.ts || Date.now(), src: pre.src || 'manual', kind: pre.kind || '', raw: pre.raw || ''

function renderAdd() {
  const d = draft, c = calc();
  const amt = parseFloat(d.amtStr) || 0;
  let hint = '';
  if (!d.editing && amt && c.income) {
    const after = c.leftToday - amt;
    hint = after >= 0 ? `<span class="ok">${money(after, { dec: false })} left to spend today after this</span>` : `<span class="bad">This puts you ${money(-after, { dec: false })} over today's budget</span>`;
  } else if (!amt) hint = 'Type the amount';
  let notice = '';
  if (d.kind === 'credit') notice = `<div class="notice">This looks like money <b>coming in</b>, not an expense. Close this if so.</div>`;
  if (!d.editing && d.src !== 'manual' && amt) {
    const dup = S.tx.find(t => Math.abs(t.amt - amt) < .01 && Math.abs(t.ts - Date.now()) < 5 * 60e3);
    if (dup) notice += `<div class="notice">You logged ${money(dup.amt)} ${Math.max(1, Math.round((Date.now() - dup.ts) / 60e3))} min ago. Same payment? Close this to avoid counting it twice.</div>`;
  }
  const ct = d.cat ? catById(d.cat) : null;
  const catBudgetHint = ct && ct.budget ? (() => { const s = sum(c.txP.filter(t => t.cat === ct.id && t.id !== d.id).map(t => t.amt)) + amt; return `<div class="small ${s > ct.budget ? 'bad' : 'muted'}" style="text-align:center;margin-top:-4px">${esc(ct.name)}: ${money(s)} of ${money(ct.budget, { dec: false })} this month</div>`; })() : '';
  const dt = new Date(d.ts);
  const local = new Date(dt.getTime() - dt.getTimezoneOffset() * 60e3).toISOString().slice(0, 16);
  openSheet(`
    <div class="amount"><div class="val ${amt ? '' : 'zero'}"><span class="cur">${esc(S.settings.currency)}</span>${d.amtStr ? Number(d.amtStr.replace(/\.$/, '')).toLocaleString('en-IN', { maximumFractionDigits: 2 }) + (d.amtStr.endsWith('.') ? '.' : '') : '0'}</div><div class="hint">${hint}</div></div>
    ${notice}
    <div class="cats">${S.cats.map(x => `<button class="cat ${d.cat === x.id ? 'on' : ''}" data-cat="${x.id}"><span class="e">${x.emoji}</span>${esc(x.name)}</button>`).join('')}<button class="cat new" data-act="catnew-add"><span class="e">＋</span>New</button></div>
    ${catBudgetHint}
    <input id="note" placeholder="Note (what was it?)" value="${esc(d.note)}" maxlength="80" autocomplete="off" style="margin:8px 0 10px">
    <div class="modes">${['UPI', 'Card', 'Cash'].map(m => `<button data-mode="${m}" class="${d.mode === m ? 'on' : ''}">${m}</button>`).join('')}<input id="when" type="datetime-local" value="${local}" style="flex:1.6;padding:6px 8px;font-size:13px"></div>
    <div class="pad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', '⌫'].map(k => `<button data-key="${k}">${k}</button>`).join('')}</div>
    <div class="actions">${d.editing ? `<button class="btn danger" data-act="deltx">Delete</button>` : `<button class="btn" data-act="skip" title="You were going to buy it, and didn't">Skipped it <span class="gs">💪</span></button>`}
      <button class="btn primary" data-act="savetx">${d.editing ? 'Update' : 'Save'}</button></div>
    ${d.editing ? '' : '<div class="small muted" style="text-align:center;margin-top:10px">Were going to buy it and didn\'t? Tap <b>Skipped it</b> to bank the money.</div>'}`);
  // do not steal focus on phones; the numpad is the input
}
function syncDraftInputs() {
  if (!draft) return;
  const n = document.getElementById('note'); if (n) draft.note = n.value;
  const w = document.getElementById('when'); if (w && w.value) draft.ts = new Date(w.value).getTime() || draft.ts;
}
function padKey(k) {
  const d = draft; let s = d.amtStr;
  if (k === '⌫') s = s.slice(0, -1);
  else if (k === '.') { if (!s.includes('.')) s = (s || '0') + '.'; }
  else { if (s.includes('.') && s.split('.')[1].length >= 2) return; if (s === '0') s = ''; if (s.replace('.', '').length >= 9) return; s += k; }
  d.amtStr = s; syncDraftInputs(); renderAdd();
}
function saveTx() {
  syncDraftInputs();
  const amt = Math.round((parseFloat(draft.amtStr) || 0) * 100) / 100;
  if (!amt) { toast('Type an amount first'); return; }
  const tx = { id: draft.id, amt, cat: draft.cat || 'other', note: draft.note.trim(), mode: draft.mode, ts: draft.ts, src: draft.src };
  const i = S.tx.findIndex(t => t.id === tx.id);
  if (i >= 0) S.tx[i] = tx; else S.tx.push(tx);
  save();
  const wasEdit = draft.editing; closeSheet(); render();
  if (navigator.vibrate) navigator.vibrate(15);
  const c = calc();
  if (wasEdit) toast('Updated');
  else if (c.income) toast(c.leftToday >= 0 ? `Logged ${money(amt)} · ${money(c.leftToday, { dec: false })} left today` : `Logged ${money(amt)} · over today by ${money(-c.leftToday, { dec: false })}`);
  else toast(`Logged ${money(amt)} under ${catById(tx.cat).name}`);
  if (fromLink) setTimeout(() => { fromLink = false; }, 0);
}
function skipTx() {
  syncDraftInputs();
  const amt = Math.round((parseFloat(draft.amtStr) || 0) * 100) / 100;
  if (!amt) { toast('Type what it would have cost'); return; }
  const g = S.goals[0];
  S.saves.push({ id: uid(), amt, kind: 'skip', goalId: g ? g.id : null, note: draft.note.trim() || ('Skipped ' + (draft.cat ? catById(draft.cat).name.toLowerCase() : 'a buy')), ts: Date.now() });
  save(); closeSheet(); render(); confetti();
  toast(g ? `Nice. ${money(amt)} went to ${g.name} instead 💪` : `Nice. ${money(amt)} stayed in your pocket 💪`, 3200);
  checkGoalMilestone(g);
}
function checkGoalMilestone(g) {
  if (!g || !g.target) return;
  const pct = goalSaved(g) / g.target * 100;
  const hit = [100, 75, 50, 25].find(m => pct >= m);
  if (hit && (g.milestone || 0) < hit) { g.milestone = hit; save(); setTimeout(() => { confetti(); toast(hit === 100 ? `🎉 You reached ${g.name}!` : `${hit}% of the way to ${g.name}!`, 3500); }, 900); }
}

/* goals, deposits, categories */
function goalForm(g) {
  const isNew = !g; g = g || { id: uid(), name: '', emoji: '🎯', target: '', deadline: '' };
  openSheet(`<h3 style="margin:4px 0 14px">${isNew ? 'New goal' : 'Edit goal'}</h3>
    <div class="two"><div class="field" style="grid-column:span 1"><label>Emoji</label><input id="g-emoji" value="${esc(g.emoji)}" maxlength="4"></div><div class="field"><label>Target</label><input id="g-target" type="number" inputmode="decimal" value="${g.target}"></div></div>
    <div class="field"><label>Name</label><input id="g-name" value="${esc(g.name)}" placeholder="e.g. Goa trip"></div>
    <div class="field"><label>By when? (optional)</label><input id="g-deadline" type="date" value="${g.deadline || ''}"></div>
    <div class="actions">${isNew ? `<button class="btn" data-act="close">Cancel</button>` : `<button class="btn danger" data-act="goaldel" data-id="${g.id}">Delete</button>`}<button class="btn primary" data-act="goalsave" data-id="${g.id}">Save goal</button></div>`);
}
function depositForm(g, first) {
  const c = calc();
  const sug = first ? Math.max(0, c.target - c.savedP) : '';
  openSheet(`<h3 style="margin:4px 0 6px">${first ? 'Save first 🏦' : 'Add to ' + esc(g.name)}</h3>
    <p class="small muted" style="margin-top:0">${first ? 'Move the money to a savings account or FD first, then log it here.' : 'Log money you moved to savings for this goal.'}</p>
    <div class="field"><label>Amount</label><input id="d-amt" type="number" inputmode="decimal" value="${sug}"></div>
    ${S.goals.length ? `<div class="field"><label>Towards</label><select id="d-goal">${S.goals.map(x => `<option value="${x.id}" ${g && x.id === g.id ? 'selected' : ''}>${esc(x.emoji)} ${esc(x.name)}</option>`).join('')}<option value="">General savings</option></select></div>` : ''}
    <div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="depositsave" data-kind="${first ? 'first' : 'manual'}">Log it</button></div>`);
}
function catForm(ct, back) {
  catForm.back = back || null;
  const isNew = !ct; ct = ct || { id: uid(), name: '', emoji: '🏷️', budget: 0 };
  openSheet(`<h3 style="margin:4px 0 14px">${isNew ? 'New category' : 'Edit category'}</h3>
    <div class="two"><div class="field"><label>Emoji</label><input id="c-emoji" value="${esc(ct.emoji)}" maxlength="4"></div><div class="field"><label>Monthly budget</label><input id="c-budget" type="number" inputmode="decimal" value="${ct.budget || ''}" placeholder="No limit"></div></div>
    <div class="field"><label>Name</label><input id="c-name" value="${esc(ct.name)}"></div>
    <div class="actions">${isNew || ct.id === 'other' ? `<button class="btn" data-act="close">Cancel</button>` : `<button class="btn danger" data-act="catdel" data-id="${ct.id}">Delete</button>`}<button class="btn primary" data-act="catsave" data-id="${ct.id}">Save</button></div>`);
}

/* ---------- import / export ---------- */
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportCsv() {
  const rows = [['Date', 'Time', 'Amount', 'Category', 'Note', 'Mode']];
  [...S.tx].sort((a, b) => a.ts - b.ts).forEach(t => { const d = new Date(t.ts); rows.push([d.toLocaleDateString('en-CA'), d.toTimeString().slice(0, 5), t.amt, catById(t.cat).name, t.note, t.mode]); });
  download('kharcha-' + new Date().toLocaleDateString('en-CA') + '.csv', rows.map(r => r.map(v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v).join(',')).join('\n'), 'text/csv');
}
function importJson() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; f.text().then(t => {
    try { const d = JSON.parse(t); if (d.v !== 1 || !Array.isArray(d.tx)) throw 0; if (!confirm(`Replace this phone's data with the backup (${d.tx.length} expenses)?`)) return; S = Object.assign(freshState(), d); save(); render(); toast('Backup restored'); }
    catch (e) { toast('That file is not a Kharcha backup'); }
  }); };
  inp.click();
}

/* ---------- deep links (#add?...) and share target (?text=...) ---------- */
let fromLink = false;
function handleIncoming() {
  let params = null;
  if (location.hash.startsWith('#add')) {
    const q = location.hash.split('?').slice(1).join('?');
    // MacroDroid pastes the notification text raw after "text=", so it may hold spaces, & or #. Take it whole.
    const ti = q.search(/(^|&)text=/);
    const head = ti >= 0 ? q.slice(0, ti) : q;
    params = new URLSearchParams(head);
    if (ti >= 0) { let raw = q.slice(ti).replace(/^&?text=/, ''); try { raw = decodeURIComponent(raw.replace(/\+/g, ' ')); } catch (e) {} params.set('text', raw); }
  }
  else if (location.search && /[?&](share|text|title|amount)=/.test(location.search)) {
    params = new URLSearchParams(location.search);
    history.replaceState(null, '', location.pathname + '#add');
  }
  if (!params) return false;
  if (!S.settings.onboarded) { S.settings.onboarded = true; save(); render(); }
  const raw = [params.get('title'), params.get('text'), params.get('merchant'), params.get('note')].filter(Boolean).join(' ').trim();
  const P = window.KharchaParse.parse(raw);
  const amount = parseFloat(params.get('amount')) || P.amount || 0;
  const merchant = params.get('merchant') || P.merchant || '';
  const cat = params.get('cat') || window.KharchaParse.guessCategory(merchant + ' ' + raw);
  fromLink = !!raw || !!amount;
  openAdd({ amount, note: params.get('note') || merchant, cat: S.cats.some(c => c.id === cat) ? cat : '', src: (raw || params.get('cat')) ? 'auto' : 'manual', kind: P.kind === 'credit' ? 'credit' : '', raw });
  return true;
}

/* ---------- Android app: payment notifications ---------- */
const KN = IS_APP && window.Capacitor.Plugins ? window.Capacitor.Plugins.KharchaNative : null;
let nat = { listener: false, notifications: false, overlay: false };
function syncCats() { if (KN) KN.setCats({ cats: S.cats.map(c => ({ id: c.id, name: c.name })) }).catch(() => {}); }
async function nativeSync() {
  if (!KN) return;
  try {
    const r = await KN.drain();
    let added = 0;
    (r.items || []).forEach(it => {
      if (S.tx.some(t => t.id === it.id)) return;
      S.tx.push({ id: it.id, amt: it.amt, cat: S.cats.some(c => c.id === it.cat) ? it.cat : 'other', note: it.note || '', mode: 'UPI', ts: it.ts, src: 'notif' });
      added++;
    });
    if (added) { save(); render(); toast(added + ' expense' + (added > 1 ? 's' : '') + ' saved from notifications'); }
    syncCats();
    nat = await KN.status();
    if (nat.notifications) KN.showQuickAdd().catch(() => {});
    if ((tab === 'settings' || tab === 'home') && !draft) render();
  } catch (e) {}
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-tab]'); if (!t) return;
  if (t.dataset.tab) { go(t.dataset.tab); return; }
  if (t.dataset.key) { tick(); padKey(t.dataset.key); return; }
  if (t.dataset.cat && draft) { tick(10); syncDraftInputs(); draft.cat = draft.cat === t.dataset.cat ? '' : t.dataset.cat; renderAdd(); return; }
  if (t.dataset.mode && draft) { syncDraftInputs(); draft.mode = t.dataset.mode; renderAdd(); return; }
  if (t.dataset.hview) { histView = t.dataset.hview; render(true); return; }
  if (t.dataset.hcat !== undefined) { histCat = t.dataset.hcat; render(); return; }
  if (t.dataset.hist) { histFilter = t.dataset.hist; render(); return; }
  if (t.dataset.themeBtn) { S.settings.theme = t.dataset.themeBtn; save(); render(); return; }
  if (t.dataset.pct) { onbRead(); onb.save = String(Math.round((+onb.income || 0) * t.dataset.pct / 100)); renderOnboarding(); return; }
  if (t.dataset.onb) {
    onbRead(); const a = t.dataset.onb;
    if (a === 'next') { onb.step++; renderOnboarding(); }
    if (a === 'skip') { onb.income = ''; onb.save = ''; onb.step++; renderOnboarding(); }
    if (a === 'finish' || a === 'finish-skip') {
      S.settings.name = onb.name; S.settings.income = +onb.income || 0;
      S.settings.saveTarget = onb.income ? (onb.save === '' ? Math.round(S.settings.income * .2) : +onb.save || 0) : 0;
      if (a === 'finish' && onb.goal && +onb.goalTarget) S.goals.push({ id: uid(), name: onb.goal, emoji: '🎯', target: +onb.goalTarget, deadline: '' });
      S.settings.onboarded = true; S.created = Date.now(); save(); go('home');
      if (S.settings.saveTarget) setTimeout(() => toast('First move: save ' + money(S.settings.saveTarget, { dec: false }) + ' before you spend anything'), 400);
    }
    return;
  }
  const act = t.dataset.act, id = t.dataset.id;
  switch (act) {
    case 'add': openAdd(); break;
    case 'edit': openAdd({ id }); break;
    case 'savetx': saveTx(); break;
    case 'skip': skipTx(); break;
    case 'deltx': {
      const gone = S.tx.find(x => x.id === draft.id); if (!gone) break;
      S.tx = S.tx.filter(x => x.id !== gone.id); save(); closeSheet(); render(); tick(20);
      toast('Deleted ' + money(gone.amt), 5000, { label: 'Undo', fn: () => { if (!S.tx.some(x => x.id === gone.id)) { S.tx.push(gone); save(); render(); toast('Restored'); } } });
      break;
    }
    case 'toastact': { const f = toast._fn; toast._fn = null; $('#toast').classList.remove('show'); if (f) f(); break; }
    case 'close': if (catForm.back) { const d = catForm.back; catForm.back = null; draft = d; renderAdd(); } else closeSheet(); break;
    case 'newgoal': goalForm(); break;
    case 'goaledit': goalForm(S.goals.find(g => g.id === id)); break;
    case 'goalsave': {
      const name = $('#g-name').value.trim(), target = +$('#g-target').value;
      if (!name || !target) { toast('Give it a name and an amount'); break; }
      const g = S.goals.find(x => x.id === id) || (S.goals.push({ id }), S.goals[S.goals.length - 1]);
      Object.assign(g, { name, target, emoji: $('#g-emoji').value.trim() || '🎯', deadline: $('#g-deadline').value });
      save(); closeSheet(); render(); break;
    }
    case 'goaldel': if (confirm('Delete this goal? Its savings log stays.')) { S.goals = S.goals.filter(g => g.id !== id); save(); closeSheet(); render(); } break;
    case 'deposit': depositForm(S.goals.find(g => g.id === id), false); break;
    case 'savefirst': depositForm(S.goals[0], true); break;
    case 'depositsave': {
      const amt = +$('#d-amt').value; if (!amt) { toast('Type an amount'); break; }
      const gid = $('#d-goal') ? $('#d-goal').value || null : null;
      S.saves.push({ id: uid(), amt, kind: t.dataset.kind, goalId: gid, note: t.dataset.kind === 'first' ? 'Saved first' : '', ts: Date.now() });
      save(); closeSheet(); render(); confetti(); toast(`+${money(amt)} saved. Future you says thanks.`);
      checkGoalMilestone(S.goals.find(g => g.id === gid)); break;
    }
    case 'delsave': if (confirm('Remove this savings entry?')) { S.saves = S.saves.filter(s => s.id !== id); save(); render(); } break;
    case 'catup': { const k = S.cats.findIndex(c => c.id === id); if (k > 0) { [S.cats[k - 1], S.cats[k]] = [S.cats[k], S.cats[k - 1]]; save(); syncCats(); render(); } break; }
    case 'catedit': catForm(S.cats.find(c => c.id === id)); break;
    case 'catnew': catForm(); break;
    case 'catsave': {
      const name = $('#c-name').value.trim(); if (!name) { toast('Name it'); break; }
      const ct = S.cats.find(x => x.id === id) || (S.cats.splice(S.cats.length - 1, 0, { id }), S.cats.find(x => x.id === id));
      Object.assign(ct, { name, emoji: $('#c-emoji').value.trim() || '🏷️', budget: +$('#c-budget').value || 0 });
      save(); syncCats();
      if (catForm.back) { const d = catForm.back; catForm.back = null; d.cat = ct.id; draft = d; renderAdd(); render(); toast('Added ' + ct.name); break; }
      closeSheet(); render(); break;
    }
    case 'catnew-add': { syncDraftInputs(); catForm(null, draft); break; }
    case 'subnew': subForm(); break;
    case 'subedit': subForm(S.subs.find(x => x.id === id)); break;
    case 'subsave': {
      const name = $('#s-name').value.trim(), amt = +$('#s-amt').value;
      if (!name || !amt) { toast('Give it a name and an amount'); break; }
      let sub = S.subs.find(x => x.id === id); const fresh = !sub;
      if (!sub) { sub = { id }; S.subs.push(sub); }
      Object.assign(sub, { name, amt, day: +$('#s-day').value, cat: $('#s-cat').value });
      if (fresh) sub.last = dueDate(sub, new Date()) <= new Date() ? monthKey(new Date()) : '';   // no backfill for a day already gone this month
      save(); closeSheet(); render(); break;
    }
    case 'subdel': S.subs = S.subs.filter(x => x.id !== id); save(); closeSheet(); render(); toast('Removed'); break;
    case 'catdel': if (confirm('Delete this category? Its expenses move to Other.')) { S.tx.forEach(x => { if (x.cat === id) x.cat = 'other'; }); S.cats = S.cats.filter(c => c.id !== id); save(); syncCats(); closeSheet(); render(); } break;
    case 'natlisten': KN && KN.openAccessSettings(); break;
    case 'natoverlay': KN && KN.openOverlaySettings(); break;
    case 'natnotif': KN && KN.requestNotifications().then(() => setTimeout(nativeSync, 1500)); break;
    case 'natbattery': KN && KN.openBatterySettings(); break;
    case 'natquick': KN && KN.requestNotifications().then(() => setTimeout(() => KN.showQuickAdd().then(() => toast('Pull down the notification shade')), 800)); break;
    case 'nattest': KN && (nat.notifications ? KN.test().then(() => toast('Check your notifications')) : toast('Allow popups first')); break;
    case 'copyurl': { const u = appUrl(); (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('Copied. Paste it in MacroDroid.'), () => prompt('Copy this URL', u)); break; }
    case 'smstest': { const v = $('#smstest').value.trim(); if (!v) { toast('Paste an SMS first'); break; } location.hash = '#add?text=' + encodeURIComponent(v); break; }
    case 'export': download('kharcha-backup-' + new Date().toLocaleDateString('en-CA') + '.json', JSON.stringify(S), 'application/json'); break;
    case 'import': importJson(); break;
    case 'csv': exportCsv(); break;
    case 'reset': if (confirm('Erase all expenses, goals and settings on this phone?') && confirm('Really? This cannot be undone.')) { localStorage.removeItem(KEY); S = freshState(); onb = { step: 0, name: '', income: '', save: '', goal: '', goalTarget: '' }; render(); } break;
  }
});
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'histq') { histQuery = t.value; const pos = t.selectionStart; render(); const n = $('#histq'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.dataset.catbudget) { const c = S.cats.find(x => x.id === t.dataset.catbudget); c.budget = +t.value || 0; save(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.set) { const k = t.dataset.set; S.settings[k] = ['income', 'saveTarget', 'startDay'].includes(k) ? +t.value || 0 : t.value; save(); render(); }
});
document.addEventListener('keydown', e => {
  if (!draft || ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) { if (e.key === 'Escape' && draft) closeSheet(); return; }
  if (/^[0-9.]$/.test(e.key)) padKey(e.key);
  else if (e.key === 'Backspace') padKey('⌫');
  else if (e.key === 'Enter') saveTx();
  else if (e.key === 'Escape') closeSheet();
});
// swipe down to close the sheet
(() => { let y0 = null; const sh = $('#sheet');
  sh.addEventListener('touchstart', e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
  sh.addEventListener('touchend', e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 90) closeSheet(); y0 = null; }, { passive: true });
})();
window.addEventListener('hashchange', () => { if (location.hash.startsWith('#add')) handleIncoming(); });
// refresh numbers when the app comes back to the front (day may have changed)
document.addEventListener('visibilitychange', () => { if (!document.hidden && !draft) { S = load(); runSubs(); render(); nativeSync(); } });

runSubs();
render();
handleIncoming();
// Android app: kharcha://add?text=... from MacroDroid
if (IS_APP && Capacitor.Plugins && Capacitor.Plugins.App) {
  let lastUrl = '';
  const openUrl = u => {
    if (!u || u === lastUrl || !u.startsWith('kharcha://')) return; lastUrl = u;
    history.replaceState(null, '', '#add?' + u.split('?').slice(1).join('?')); handleIncoming();
  };
  Capacitor.Plugins.App.addListener('appUrlOpen', e => openUrl(e.url));
  Capacitor.Plugins.App.addListener('backButton', () => {
    if ($('#sheet').classList.contains('show')) closeSheet();
    else if (tab !== 'home') go('home');
    else if (Capacitor.Plugins.App.exitApp) Capacitor.Plugins.App.exitApp();
  });
  nativeSync();
  Capacitor.Plugins.App.getLaunchUrl().then(r => r && openUrl(r.url)).catch(() => {});
}
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
