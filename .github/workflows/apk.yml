name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the APK under
        default: v1.0.0
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm test
      - run: npm run build:www
      - name: Create the Android project
        run: |
          npx cap add android
          python3 scripts/patch-android.py
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Kharcha.apk
      - uses: actions/upload-artifact@v4
        with: { name: Kharcha-apk, path: Kharcha.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Kharcha ${{ inputs.tag || github.ref_name }}
          body: |
            Download **Kharcha.apk** below on your Android phone and tap it to install (allow "install unknown apps" for your browser when asked).
            Works fully offline. Open Kharcha → Setup → Auto-popup and switch on Notification access.
          files: Kharcha.apk
