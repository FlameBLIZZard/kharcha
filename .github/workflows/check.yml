name: Check
# Every pull request: run the tests and make sure the Android app still builds. Publishes nothing.
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm test
      - run: npm run build:www
      - name: Create the Android project
        run: |
          npx cap add android
          python3 scripts/patch-android.py
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: Kharcha-apk-check, path: android/app/build/outputs/apk/debug/app-debug.apk, retention-days: 3 }
